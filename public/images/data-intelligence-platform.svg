  <text x="210" y="452" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="10" fill="#86efac" letter-spacing="0.5">SOURCE SYSTEMS</text>

  <text x="450" y="430" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="28" font-weight="700" fill="#22c55e">4</text>
  <text x="450" y="452" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="10" fill="#86efac" letter-spacing="0.5">STACK LAYERS</text>

  <text x="690" y="430" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="28" font-weight="700" fill="#fbbf24">12</text>
  <text x="690" y="452" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="10" fill="#fde68a" letter-spacing="0.5">MONTHS</text>

