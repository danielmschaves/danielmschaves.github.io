<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="rp-bg" x1="0" y1="0" x2="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020e1a"/>
      <stop offset="100%" stop-color="#0d0f2e"/>
    </linearGradient>
    <pattern id="rp-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" stroke="#8b5cf6" stroke-width="0.4"/>
    </pattern>
    <linearGradient id="rp-node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f0c2e"/>
    </linearGradient>
    <linearGradient id="rp-rain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <marker id="rp-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#a78bfa" opacity="0.6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#rp-bg)"/>
  <rect width="1200" height="630" fill="url(#rp-grid)" opacity="0.06"/>

  <!-- Subtle rain drop hints in background -->
  <line x1="100" y1="0" x2="92" y2="40" stroke="#0ea5e9" stroke-width="0.5" opacity="0.05"/>
  <line x1="250" y1="0" x2="242" y2="40" stroke="#0ea5e9" stroke-width="0.5" opacity="0.05"/>
  <line x1="400" y1="0" x2="392" y2="40" stroke="#0ea5e9" stroke-width="0.5" opacity="0.05"/>
  <line x1="700" y1="0" x2="692" y2="40" stroke="#0ea5e9" stroke-width="0.5" opacity="0.05"/>
  <line x1="900" y1="0" x2="892" y2="40" stroke="#0ea5e9" stroke-width="0.5" opacity="0.05"/>
  <line x1="1100" y1="0" x2="1092" y2="40" stroke="#0ea5e9" stroke-width="0.5" opacity="0.05"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="20" fill="#f1f5f9" font-weight="600" letter-spacing="0.5">Rainfall Prediction · Australia</text>
  <text x="600" y="62" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="11" fill="#a78bfa" letter-spacing="2" opacity="0.85">Linear Regression · Decision Tree · Logistic · SVM · Classification</text>

  <!-- ── TOP: weatherAUS Dataset bar visualization ── -->
  <rect x="40" y="80" width="1120" height="130" rx="6" fill="#020c18" stroke="#a78bfa" stroke-width="0.6" opacity="0.9"/>
  <text x="600" y="102" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#a78bfa" letter-spacing="2.5" opacity="0.9">weatherAUS DATASET  ·  2008 – 2017  ·  145,460 RECORDS</text>
  <line x1="50" y1="108" x2="1150" y2="108" stroke="#a78bfa" stroke-width="0.4" opacity="0.3"/>

  <!-- Rain gauge visualization: monthly rainfall bars -->
  <!-- 12 months of bars -->
  <text x="80"  y="122" text-anchor="middle" font-family="ui-monospace,monospace" font-size="6" fill="#4e7192">JAN</text>
  <text x="170" y="122" text-anchor="middle" font-family="ui-monospace,monospace" font-size="6" fill="#4e7192">FEB</text>
  <text x="260" y="122" text-anchor="middle" font-family="ui-monospace,monospace" font-size="6" fill="#4e7192">MAR</text>
  <text x="350" y="122" text-anchor="middle" font-family="ui-monospace,monospace" font-size="6" fill="#4e7192">APR</text>
  <text x="440" y="122" text-anchor="middle" font-family="ui-monospace,monospace" font-size="6" fill="#4e7192">MAY</text>
  <text x="530" y="122" text-anchor="middle" font-family="ui-monospace,monospace" font-size="6" fill="#4e7192">JUN</text>
  <text x="620" y="122" text-anchor="middle" font-family="ui-monospace,monospace" font-size="6" fill="#4e7192">JUL</text>
  <text x="710" y="122" text-anchor="middle" font-family="ui-monospace,monospace" font-size="6" fill="#4e7192">AUG</text>
  <text x="800" y="122" text-anchor="middle" font-family="ui-monospace,monospace" font-size="6" fill="#4e7192">SEP</text>
  <text x="890" y="122" text-anchor="middle" font-family="ui-monospace,monospace" font-size="6" fill="#4e7192">OCT</text>
  <text x="980" y="122" text-anchor="middle" font-family="ui-monospace,monospace" font-size="6" fill="#4e7192">NOV</text>
  <text x="1070" y="122" text-anchor="middle" font-family="ui-monospace,monospace" font-size="6" fill="#4e7192">DEC</text>

  <!-- Monthly rain bars (heights vary) -->
  <!-- JAN: low rain (dry summer in AU) -->
  <rect x="55"  y="175" width="50" height="-25" rx="2" fill="url(#rp-rain)" opacity="0.6"/>
  <rect x="55"  y="150" width="50" height="25" rx="2" fill="url(#rp-rain)" opacity="0.6"/>
  <!-- FEB: moderate -->
  <rect x="145" y="135" width="50" height="40" rx="2" fill="url(#rp-rain)" opacity="0.65"/>
  <!-- MAR: moderate -->
  <rect x="235" y="145" width="50" height="30" rx="2" fill="url(#rp-rain)" opacity="0.6"/>
  <!-- APR: increasing -->
  <rect x="325" y="140" width="50" height="35" rx="2" fill="url(#rp-rain)" opacity="0.7"/>
  <!-- MAY: wet season starts -->
  <rect x="415" y="128" width="50" height="47" rx="2" fill="url(#rp-rain)" opacity="0.75"/>
  <!-- JUN: peak wet -->
  <rect x="505" y="120" width="50" height="55" rx="2" fill="#0284c7" opacity="0.75"/>
  <!-- JUL: peak -->
  <rect x="595" y="118" width="50" height="57" rx="2" fill="#0284c7" opacity="0.8"/>
  <!-- AUG: still wet -->
  <rect x="685" y="122" width="50" height="53" rx="2" fill="url(#rp-rain)" opacity="0.75"/>
  <!-- SEP: decreasing -->
  <rect x="775" y="130" width="50" height="45" rx="2" fill="url(#rp-rain)" opacity="0.7"/>
  <!-- OCT: moderate -->
  <rect x="865" y="140" width="50" height="35" rx="2" fill="url(#rp-rain)" opacity="0.65"/>
  <!-- NOV: spring showers -->
  <rect x="955" y="148" width="50" height="27" rx="2" fill="url(#rp-rain)" opacity="0.6"/>
  <!-- DEC: summer again -->
  <rect x="1045" y="162" width="50" height="13" rx="2" fill="url(#rp-rain)" opacity="0.55"/>

  <!-- Rain gauge baseline -->
  <line x1="50" y1="175" x2="1150" y2="175" stroke="#a78bfa" stroke-width="0.5" opacity="0.3"/>

  <!-- Forecast label -->
  <text x="600" y="195" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#4e7192" letter-spacing="2">RAIN TOMORROW? — BINARY CLASSIFICATION</text>

  <!-- ── 4 ALGORITHM CARDS in 2×2 grid ── -->
  <!-- Card 1: Linear Regression (top-left) -->
  <rect x="40" y="228" width="270" height="160" rx="8" fill="url(#rp-node)" stroke="#a78bfa" stroke-width="0.8" opacity="0.95"/>
  <text x="175" y="252" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#c4b5fd" letter-spacing="2">LINEAR REGRESSION</text>
  <line x1="52" y1="260" x2="298" y2="260" stroke="#a78bfa" stroke-width="0.4" opacity="0.3"/>
  <!-- Accuracy bar -->
  <text x="55" y="282" font-family="ui-monospace,monospace" font-size="8" fill="#64748b">Accuracy</text>
  <rect x="52" y="288" width="218" height="12" rx="3" fill="#0f0c2e" stroke="#a78bfa" stroke-width="0.4" opacity="0.8"/>
  <rect x="52" y="288" width="154" height="12" rx="3" fill="#a78bfa" opacity="0.55"/>
  <text x="276" y="299" font-family="ui-monospace,monospace" font-size="8" fill="#a78bfa" font-weight="700">70.8%</text>
  <!-- MSE -->
  <text x="55" y="317" font-family="ui-monospace,monospace" font-size="8" fill="#64748b">R² Score</text>
  <rect x="52" y="323" width="218" height="12" rx="3" fill="#0f0c2e" stroke="#a78bfa" stroke-width="0.4" opacity="0.8"/>
  <rect x="52" y="323" width="110" height="12" rx="3" fill="#8b5cf6" opacity="0.45"/>
  <text x="276" y="334" font-family="ui-monospace,monospace" font-size="8" fill="#8b5cf6">0.504</text>
  <!-- Details -->
  <text x="55" y="354" font-family="ui-monospace,monospace" font-size="7" fill="#4e7192">Linear · OLS · continuous output</text>
  <text x="55" y="368" font-family="ui-monospace,monospace" font-size="7" fill="#4e7192">MSE: 0.211  ·  Threshold applied</text>

  <!-- Card 2: Decision Tree (top-right) -->
  <rect x="330" y="228" width="270" height="160" rx="8" fill="url(#rp-node)" stroke="#10b981" stroke-width="0.8" opacity="0.95"/>
  <text x="465" y="252" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#c4b5fd" letter-spacing="2">DECISION TREE</text>
  <line x1="342" y1="260" x2="588" y2="260" stroke="#a78bfa" stroke-width="0.4" opacity="0.3"/>
  <!-- Tree mini visual -->
  <circle cx="465" cy="280" r="8" fill="#10b981" opacity="0.35" stroke="#10b981" stroke-width="0.7"/>
  <text x="465" y="284" text-anchor="middle" font-family="ui-monospace,monospace" font-size="6" fill="#10b981">root</text>
  <line x1="459" y1="288" x2="442" y2="300" stroke="#10b981" stroke-width="0.6" opacity="0.4"/>
  <circle cx="438" cy="303" r="6" fill="#10b981" opacity="0.3"/>
  <line x1="471" y1="288" x2="488" y2="300" stroke="#10b981" stroke-width="0.6" opacity="0.4"/>
  <circle cx="492" cy="303" r="6" fill="#10b981" opacity="0.3"/>
  <!-- Accuracy bar -->
  <text x="342" y="325" font-family="ui-monospace,monospace" font-size="8" fill="#64748b">Accuracy</text>
  <rect x="342" y="331" width="218" height="12" rx="3" fill="#0f0c2e" stroke="#a78bfa" stroke-width="0.4" opacity="0.8"/>
  <rect x="342" y="331" width="174" height="12" rx="3" fill="#10b981" opacity="0.55"/>
  <text x="566" y="342" font-family="ui-monospace,monospace" font-size="8" fill="#10b981" font-weight="700">79.7%</text>
  <text x="342" y="360" font-family="ui-monospace,monospace" font-size="7" fill="#4e7192">max_depth=4  ·  Gini impurity</text>
  <text x="342" y="374" font-family="ui-monospace,monospace" font-size="7" fill="#4e7192">F1: 0.73  ·  Precision: 0.76</text>

  <!-- Card 3: Logistic Regression (bottom-left) -->
  <rect x="620" y="228" width="270" height="160" rx="8" fill="url(#rp-node)" stroke="#a78bfa" stroke-width="0.8" opacity="0.95"/>
  <text x="755" y="252" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#c4b5fd" letter-spacing="2">LOGISTIC REGRESSION</text>
  <line x1="632" y1="260" x2="878" y2="260" stroke="#a78bfa" stroke-width="0.4" opacity="0.3"/>
  <!-- Sigmoid curve hint -->
  <path d="M640,310 Q680,308 710,295 Q740,280 780,278 Q810,277 840,275" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.5"/>
  <!-- Threshold line -->
  <line x1="640" y1="293" x2="878" y2="293" stroke="#a78bfa" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.3"/>
  <text x="874" y="290" text-anchor="end" font-family="ui-monospace,monospace" font-size="6" fill="#a78bfa" opacity="0.6">0.5</text>
  <!-- Accuracy bar -->
  <text x="635" y="325" font-family="ui-monospace,monospace" font-size="8" fill="#64748b">Accuracy</text>
  <rect x="632" y="331" width="218" height="12" rx="3" fill="#0f0c2e" stroke="#a78bfa" stroke-width="0.4" opacity="0.8"/>
  <rect x="632" y="331" width="168" height="12" rx="3" fill="#a78bfa" opacity="0.6"/>
  <text x="856" y="342" font-family="ui-monospace,monospace" font-size="8" fill="#a78bfa" font-weight="700">77.1%</text>
  <text x="635" y="360" font-family="ui-monospace,monospace" font-size="7" fill="#4e7192">C=0.01  ·  L2 regularization</text>
  <text x="635" y="374" font-family="ui-monospace,monospace" font-size="7" fill="#4e7192">AUC-ROC: 0.81  ·  balanced</text>

  <!-- Card 4: SVM (bottom-right) — best performer -->
  <rect x="910" y="228" width="270" height="160" rx="8" fill="url(#rp-node)" stroke="#fbbf24" stroke-width="0.9" opacity="0.95"/>
  <text x="1045" y="249" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#c4b5fd" letter-spacing="2">SVM</text>
  <text x="1045" y="260" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#fbbf24" font-weight="700">★ BEST MODEL</text>
  <line x1="922" y1="267" x2="1168" y2="267" stroke="#fbbf24" stroke-width="0.4" opacity="0.3"/>
  <!-- SVM decision boundary hint -->
  <line x1="1045" y1="280" x2="1045" y2="310" stroke="#fbbf24" stroke-width="2" opacity="0.4"/>
  <!-- Support vectors -->
  <circle cx="1010" cy="292" r="5" fill="#ef4444" opacity="0.5"/>
  <circle cx="1015" cy="302" r="5" fill="#ef4444" opacity="0.5"/>
