  <polygon points="352,285 340,278 340,292" fill="#0ea5e9" opacity="0.8"/>
  <text x="300" y="272" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#4e7192" letter-spacing="1">TRANSFORM</text>

