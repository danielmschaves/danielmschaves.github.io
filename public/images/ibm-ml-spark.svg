  <line x1="480" y1="295" x2="540" y2="295" stroke="#a78bfa" stroke-width="1.5" opacity="0.5" marker-end="url(#ml-arr)"/>
  <line x1="810" y1="295" x2="880" y2="295" stroke="#a78bfa" stroke-width="1.5" opacity="0.5" marker-end="url(#ml-arr)"/>

