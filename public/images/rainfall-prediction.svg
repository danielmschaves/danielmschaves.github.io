  <!-- Margin lines -->
  <line x1="1020" y1="275" x2="1020" y2="315" stroke="#fbbf24" stroke-width="0.7" stroke-dasharray="3,3" opacity="0.35"/>
  <line x1="1070" y1="275" x2="1070" y2="315" stroke="#fbbf24" stroke-width="0.7" stroke-dasharray="3,3" opacity="0.35"/>
  <!-- Accuracy bar -->
  <text x="922" y="332" font-family="ui-monospace,monospace" font-size="8" fill="#64748b">Accuracy</text>
  <rect x="922" y="338" width="218" height="12" rx="3" fill="#0f0c2e" stroke="#fbbf24" stroke-width="0.4" opacity="0.8"/>
  <rect x="922" y="338" width="196" height="12" rx="3" fill="#fbbf24" opacity="0.65"/>
  <text x="1146" y="349" font-family="ui-monospace,monospace" font-size="8" fill="#fbbf24" font-weight="700">90.1%</text>
  <text x="922" y="367" font-family="ui-monospace,monospace" font-size="7" fill="#4e7192">kernel=rbf  ·  C=1  ·  max margin</text>
  <text x="922" y="381" font-family="ui-monospace,monospace" font-size="7" fill="#4e7192">F1: 0.87  ·  Recall: 0.89</text>

  <!-- ── EVALUATION METRICS ROW ── -->
  <!-- Confusion matrix hint -->
  <rect x="40" y="410" width="190" height="130" rx="6" fill="url(#rp-node)" stroke="#a78bfa" stroke-width="0.6" opacity="0.9"/>
  <text x="135" y="432" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#c4b5fd" letter-spacing="1">CONFUSION MATRIX</text>
  <!-- 2x2 matrix -->
  <rect x="55"  y="442" width="60" height="45" rx="2" fill="#10b981" opacity="0.25" stroke="#10b981" stroke-width="0.5"/>
  <rect x="120" y="442" width="60" height="45" rx="2" fill="#ef4444" opacity="0.15" stroke="#ef4444" stroke-width="0.5"/>
  <rect x="55"  y="492" width="60" height="40" rx="2" fill="#ef4444" opacity="0.15" stroke="#ef4444" stroke-width="0.5"/>
  <rect x="120" y="492" width="60" height="40" rx="2" fill="#10b981" opacity="0.25" stroke="#10b981" stroke-width="0.5"/>
  <text x="85"  y="469" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" fill="#10b981" font-weight="700">TP</text>
  <text x="150" y="469" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" fill="#ef4444" font-weight="700">FP</text>
  <text x="85"  y="516" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" fill="#ef4444" font-weight="700">FN</text>
  <text x="150" y="516" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" fill="#10b981" font-weight="700">TN</text>

  <!-- Metric cards -->
  <rect x="248" y="410" width="120" height="60" rx="6" fill="url(#rp-node)" stroke="#10b981" stroke-width="0.6" opacity="0.9"/>
  <text x="308" y="433" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#c4b5fd" letter-spacing="1">ACCURACY</text>
  <text x="308" y="455" text-anchor="middle" font-family="ui-monospace,monospace" font-size="20" fill="#10b981" font-weight="700">90.1%</text>
  <text x="308" y="465" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#4e7192">SVM best</text>

  <rect x="384" y="410" width="120" height="60" rx="6" fill="url(#rp-node)" stroke="#a78bfa" stroke-width="0.6" opacity="0.9"/>
  <text x="444" y="433" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#c4b5fd" letter-spacing="1">F1 SCORE</text>
  <text x="444" y="455" text-anchor="middle" font-family="ui-monospace,monospace" font-size="20" fill="#a78bfa" font-weight="700">0.87</text>
  <text x="444" y="465" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#4e7192">weighted avg</text>

  <rect x="520" y="410" width="120" height="60" rx="6" fill="url(#rp-node)" stroke="#a78bfa" stroke-width="0.6" opacity="0.9"/>
  <text x="580" y="433" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#c4b5fd" letter-spacing="1">AUC-ROC</text>
  <text x="580" y="455" text-anchor="middle" font-family="ui-monospace,monospace" font-size="20" fill="#a78bfa" font-weight="700">0.83</text>
  <text x="580" y="465" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#4e7192">SVM curve</text>

  <!-- Model comparison chart -->
  <rect x="658" y="410" width="522" height="130" rx="6" fill="url(#rp-node)" stroke="#a78bfa" stroke-width="0.6" opacity="0.9"/>
  <text x="919" y="432" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#c4b5fd" letter-spacing="2">MODEL COMPARISON</text>
  <line x1="668" y1="440" x2="1170" y2="440" stroke="#a78bfa" stroke-width="0.4" opacity="0.25"/>
  <!-- Bars -->
  <text x="672" y="458" font-family="ui-monospace,monospace" font-size="8" fill="#64748b">Lin. Reg.</text>
  <rect x="740" y="449" width="154" height="10" rx="2" fill="#a78bfa" opacity="0.4"/>
  <text x="898" y="458" font-family="ui-monospace,monospace" font-size="8" fill="#a78bfa">70.8%</text>
  <text x="672" y="476" font-family="ui-monospace,monospace" font-size="8" fill="#64748b">Log. Reg.</text>
  <rect x="740" y="467" width="168" height="10" rx="2" fill="#a78bfa" opacity="0.5"/>
  <text x="912" y="476" font-family="ui-monospace,monospace" font-size="8" fill="#a78bfa">77.1%</text>
  <text x="672" y="494" font-family="ui-monospace,monospace" font-size="8" fill="#64748b">Dec. Tree</text>
  <rect x="740" y="485" width="174" height="10" rx="2" fill="#10b981" opacity="0.55"/>
  <text x="918" y="494" font-family="ui-monospace,monospace" font-size="8" fill="#10b981">79.7%</text>
  <text x="672" y="512" font-family="ui-monospace,monospace" font-size="8" fill="#fbbf24" font-weight="700">SVM ★</text>
  <rect x="740" y="503" width="196" height="10" rx="2" fill="#fbbf24" opacity="0.65"/>
  <text x="940" y="512" font-family="ui-monospace,monospace" font-size="8" fill="#fbbf24" font-weight="700">90.1%</text>
  <text x="672" y="530" font-family="ui-monospace,monospace" font-size="7" fill="#4e7192">145,460 samples · 23 features</text>

