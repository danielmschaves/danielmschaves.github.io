  <rect x="40" y="120" width="210" height="90" rx="8" fill="url(#py-node)" stroke="#0ea5e9" stroke-width="0.7" opacity="0.95"/>
  <!-- Globe icon -->
  <circle cx="95" cy="165" r="32" fill="none" stroke="#0ea5e9" stroke-width="0.8" opacity="0.5"/>
  <ellipse cx="95" cy="165" rx="32" ry="12" fill="none" stroke="#0ea5e9" stroke-width="0.5" opacity="0.4"/>
