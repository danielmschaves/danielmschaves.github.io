  <text x="168" y="281" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8"  fill="#4e7192" letter-spacing="1">LEGACY DW</text>
  <text x="168" y="318" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7"  fill="#4e7192" letter-spacing="0.5">EXTRACT</text>
