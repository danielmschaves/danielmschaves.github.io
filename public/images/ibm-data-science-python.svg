<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="sp2-bg" x1="0" y1="0" x2="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020e1a"/>
      <stop offset="100%" stop-color="#0d0f2e"/>
    </linearGradient>
    <pattern id="sp2-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" stroke="#8b5cf6" stroke-width="0.4"/>
    </pattern>
    <linearGradient id="sp2-node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f0c2e"/>
    </linearGradient>
    <linearGradient id="sp2-tsla" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e53e1a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#e53e1a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sp2-amzn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sp2-amd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
