  <text x="170" y="155" font-family="ui-monospace,monospace" font-size="10" fill="#38bdf8" font-weight="700" letter-spacing="1">WEB</text>
  <text x="170" y="170" font-family="ui-monospace,monospace" font-size="10" fill="#38bdf8" font-weight="700" letter-spacing="1">SCRAPING</text>
  <text x="170" y="186" font-family="ui-monospace,monospace" font-size="7" fill="#64748b">BeautifulSoup</text>
  <text x="170" y="199" font-family="ui-monospace,monospace" font-size="7" fill="#64748b">requests</text>

  <!-- Source 2: API (middle, y=245-335) -->
  <rect x="40" y="245" width="210" height="90" rx="8" fill="url(#py-node)" stroke="#0ea5e9" stroke-width="0.7" opacity="0.9"/>
