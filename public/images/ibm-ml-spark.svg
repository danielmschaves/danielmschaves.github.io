  <circle cx="232" cy="295" r="4" fill="#a78bfa" opacity="0.7"/>
  <circle cx="250" cy="295" r="3.5" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="268" cy="295" r="4" fill="#a78bfa" opacity="0.7"/>

  <circle cx="494" cy="295" r="3.5" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="508" cy="295" r="4" fill="#a78bfa" opacity="0.7"/>
  <circle cx="522" cy="295" r="3.5" fill="#8b5cf6" opacity="0.5"/>

