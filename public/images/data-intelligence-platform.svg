  <text x="225" y="215" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="11" fill="#86efac" letter-spacing="1">DATA LAKE</text>
  <line x1="140" y1="228" x2="310" y2="228" stroke="#15803d" stroke-width="0.8" opacity="0.6"/>
  <text x="225" y="252" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#86efac">Raw ingestion</text>
