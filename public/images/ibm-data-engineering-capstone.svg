  <text x="540" y="333" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#38bdf8" letter-spacing="1">PIPELINE DAG</text>

  <!-- Arrow from Airflow to Spark -->
  <line x1="652" y1="307" x2="790" y2="307" stroke="#0ea5e9" stroke-width="1.5" opacity="0.5" marker-end="url(#ic-arr)"/>
  <circle cx="668" cy="307" r="3.5" fill="#0ea5e9" opacity="0.5"/>
  <circle cx="684" cy="307" r="4" fill="#38bdf8" opacity="0.7"/>
  <circle cx="700" cy="307" r="3.5" fill="#0ea5e9" opacity="0.5"/>
  <circle cx="720" cy="307" r="3.5" fill="#0ea5e9" opacity="0.5"/>
  <circle cx="738" cy="307" r="4" fill="#38bdf8" opacity="0.7"/>
  <circle cx="756" cy="307" r="3.5" fill="#0ea5e9" opacity="0.5"/>

