<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="nw-bg" x1="0" y1="0" x2="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020e1a"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <pattern id="nw-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" stroke="#0ea5e9" stroke-width="0.4"/>
    </pattern>
    <marker id="nw-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#0ea5e9" opacity="0.55"/>
    </marker>
    <linearGradient id="nw-node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="nw-docker" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c2340"/>
      <stop offset="100%" stop-color="#071628"/>
    </linearGradient>
    <linearGradient id="nw-pg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a2e5c"/>
      <stop offset="100%" stop-color="#062248"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#nw-bg)"/>
  <rect width="1200" height="630" fill="url(#nw-grid)" opacity="0.07"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="22" fill="#f1f5f9" font-weight="600" letter-spacing="0.5">Northwind Data Pipeline</text>
  <text x="600" y="62" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="11" fill="#38bdf8" letter-spacing="2" opacity="0.85">PostgreSQL · dbt · Docker · SQL</text>

  <!-- Main pipeline backbone at y=295 -->
  <line x1="218" y1="295" x2="975" y2="295" stroke="#0369a1" stroke-width="2.5" opacity="0.35"/>

  <!-- Stage arrows -->
  <line x1="220" y1="295" x2="278" y2="295" stroke="#0ea5e9" stroke-width="1.5" opacity="0.5" marker-end="url(#nw-arr)"/>
  <line x1="498" y1="295" x2="552" y2="295" stroke="#0ea5e9" stroke-width="1.5" opacity="0.5" marker-end="url(#nw-arr)"/>
  <line x1="706" y1="295" x2="756" y2="295" stroke="#0ea5e9" stroke-width="1.5" opacity="0.5" marker-end="url(#nw-arr)"/>
  <line x1="896" y1="295" x2="970" y2="295" stroke="#0ea5e9" stroke-width="1.5" opacity="0.5" marker-end="url(#nw-arr)"/>

  <!-- Particles seg 1 -->
  <circle cx="233" cy="295" r="3" fill="#0ea5e9" opacity="0.5"/>
  <circle cx="246" cy="295" r="3.5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="260" cy="295" r="3" fill="#0ea5e9" opacity="0.5"/>

  <!-- Particles seg 2 -->
  <circle cx="513" cy="295" r="3" fill="#0ea5e9" opacity="0.5"/>
  <circle cx="526" cy="295" r="3.5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="540" cy="295" r="3" fill="#0ea5e9" opacity="0.5"/>

  <!-- Particles seg 3 -->
  <circle cx="720" cy="295" r="3" fill="#0ea5e9" opacity="0.5"/>
  <circle cx="733" cy="295" r="3.5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="747" cy="295" r="3" fill="#0ea5e9" opacity="0.5"/>

  <!-- Particles seg 4 -->
  <circle cx="910" cy="295" r="3" fill="#0ea5e9" opacity="0.5"/>
  <circle cx="925" cy="295" r="3.5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="940" cy="295" r="3" fill="#0ea5e9" opacity="0.5"/>

  <!-- STAGE 1: Northwind Source rect x=40-218, y=190-400 -->
  <rect x="40" y="185" width="178" height="220" rx="6" fill="url(#nw-node)" stroke="#0ea5e9" stroke-width="0.8" opacity="0.95"/>
  <text x="129" y="210" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#38bdf8" letter-spacing="2" opacity="0.9">NORTHWIND</text>
  <line x1="50" y1="217" x2="208" y2="217" stroke="#0ea5e9" stroke-width="0.4" opacity="0.3"/>
  <!-- Entity boxes (simplified ER diagram) -->
  <!-- Orders -->
  <rect x="55"  y="226" width="70" height="30" rx="3" fill="#0a1628" stroke="#0ea5e9" stroke-width="0.5" opacity="0.9"/>
  <text x="90" y="237" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#38bdf8">Orders</text>
  <text x="90" y="249" text-anchor="middle" font-family="ui-monospace,monospace" font-size="6" fill="#4e7192">order_id, date</text>
  <!-- Customers -->
  <rect x="135" y="226" width="74" height="30" rx="3" fill="#0a1628" stroke="#0ea5e9" stroke-width="0.5" opacity="0.9"/>
  <text x="172" y="237" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#38bdf8">Customers</text>
  <text x="172" y="249" text-anchor="middle" font-family="ui-monospace,monospace" font-size="6" fill="#4e7192">cust_id, name</text>
  <!-- Products -->
  <rect x="55"  y="268" width="70" height="30" rx="3" fill="#0a1628" stroke="#0ea5e9" stroke-width="0.5" opacity="0.85"/>
  <text x="90" y="279" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#38bdf8">Products</text>
  <text x="90" y="291" text-anchor="middle" font-family="ui-monospace,monospace" font-size="6" fill="#4e7192">prod_id, price</text>
  <!-- Employees -->
  <rect x="135" y="268" width="74" height="30" rx="3" fill="#0a1628" stroke="#0ea5e9" stroke-width="0.5" opacity="0.85"/>
  <text x="172" y="279" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#38bdf8">Employees</text>
  <text x="172" y="291" text-anchor="middle" font-family="ui-monospace,monospace" font-size="6" fill="#4e7192">emp_id, dept</text>
  <!-- OrderDetails -->
  <rect x="55"  y="310" width="70" height="30" rx="3" fill="#0a1628" stroke="#0ea5e9" stroke-width="0.5" opacity="0.8"/>
  <text x="90" y="321" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#38bdf8">OrderDetails</text>
  <text x="90" y="333" text-anchor="middle" font-family="ui-monospace,monospace" font-size="6" fill="#4e7192">qty, unit_price</text>
  <!-- Suppliers -->
  <rect x="135" y="310" width="74" height="30" rx="3" fill="#0a1628" stroke="#0ea5e9" stroke-width="0.5" opacity="0.8"/>
  <text x="172" y="321" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#38bdf8">Suppliers</text>
  <text x="172" y="333" text-anchor="middle" font-family="ui-monospace,monospace" font-size="6" fill="#4e7192">supp_id, country</text>
  <text x="129" y="367" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#64748b" letter-spacing="1.5">8 TABLES</text>
  <circle cx="62" cy="380" r="4" fill="#10b981"/><text x="74" y="384" font-family="ui-monospace,monospace" font-size="8" fill="#4e7192">OLTP SOURCE</text>

