<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="py-bg" x1="0" y1="0" x2="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020e1a"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <pattern id="py-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" stroke="#0ea5e9" stroke-width="0.4"/>
    </pattern>
    <marker id="py-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#0ea5e9" opacity="0.55"/>
    </marker>
    <linearGradient id="py-node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="py-python" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f3a5f"/>
      <stop offset="100%" stop-color="#0e1f38"/>
    </linearGradient>
    <linearGradient id="py-output" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a2840"/>
      <stop offset="100%" stop-color="#051524"/>
