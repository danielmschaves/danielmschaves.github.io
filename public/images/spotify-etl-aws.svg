<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="sp-bg" x1="0" y1="0" x2="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020e1a"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <pattern id="sp-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" stroke="#0ea5e9" stroke-width="0.4"/>
    </pattern>
    <marker id="sp-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#0ea5e9" opacity="0.55"/>
    </marker>
    <linearGradient id="sp-pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="sp-node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="sp-spotify" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#0d2238"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#sp-bg)"/>
  <rect width="1200" height="630" fill="url(#sp-grid)" opacity="0.07"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="22" fill="#f1f5f9" font-weight="600" letter-spacing="0.5">Spotify ELT Pipeline · AWS</text>
  <text x="600" y="62" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="11" fill="#38bdf8" letter-spacing="2" opacity="0.85">Airflow · DuckDB · dbt · Terraform · Motherduck · S3</text>

  <!-- Main pipe backbone y=255 -->
  <rect x="120" y="251" width="970" height="8" rx="4" fill="url(#sp-pipe)" opacity="0.45"/>

  <!-- Stage arrows -->
  <line x1="190" y1="255" x2="254" y2="255" stroke="#0ea5e9" stroke-width="1.5" opacity="0.5" marker-end="url(#sp-arr)"/>
  <line x1="394" y1="255" x2="454" y2="255" stroke="#0ea5e9" stroke-width="1.5" opacity="0.5" marker-end="url(#sp-arr)"/>
  <line x1="604" y1="255" x2="664" y2="255" stroke="#0ea5e9" stroke-width="1.5" opacity="0.5" marker-end="url(#sp-arr)"/>
  <line x1="854" y1="255" x2="904" y2="255" stroke="#0ea5e9" stroke-width="1.5" opacity="0.5" marker-end="url(#sp-arr)"/>

  <!-- Particles -->
  <circle cx="210" cy="255" r="3.5" fill="#0ea5e9" opacity="0.55"/>
  <circle cx="224" cy="255" r="4" fill="#38bdf8" opacity="0.75"/>
  <circle cx="238" cy="255" r="3.5" fill="#0ea5e9" opacity="0.55"/>

  <circle cx="410" cy="255" r="3.5" fill="#0ea5e9" opacity="0.55"/>
  <circle cx="424" cy="255" r="4" fill="#38bdf8" opacity="0.75"/>
  <circle cx="438" cy="255" r="3.5" fill="#0ea5e9" opacity="0.55"/>

  <circle cx="620" cy="255" r="3.5" fill="#0ea5e9" opacity="0.55"/>
  <circle cx="634" cy="255" r="4" fill="#38bdf8" opacity="0.75"/>
  <circle cx="648" cy="255" r="3.5" fill="#0ea5e9" opacity="0.55"/>

  <circle cx="868" cy="255" r="3.5" fill="#0ea5e9" opacity="0.55"/>
  <circle cx="882" cy="255" r="4" fill="#38bdf8" opacity="0.75"/>
  <circle cx="896" cy="255" r="3.5" fill="#0ea5e9" opacity="0.55"/>

  <!-- STAGE 1: Spotify API circle r=70, center(120, 255) -->
  <circle cx="120" cy="255" r="70" fill="url(#sp-spotify)" stroke="#0ea5e9" stroke-width="0.8" opacity="0.95"/>
  <!-- Music note -->
  <text x="120" y="240" text-anchor="middle" font-family="ui-monospace,monospace" font-size="32" fill="#1ed760" opacity="0.7">♪</text>
  <text x="120" y="273" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#38bdf8" font-weight="700" letter-spacing="1">SPOTIFY API</text>
  <text x="120" y="289" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#64748b" letter-spacing="1">playlists · tracks</text>
  <text x="120" y="302" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#64748b">albums · artists</text>

  <!-- STAGE 2: S3 cylinder, center x=325 -->
  <rect x="263" y="213" width="124" height="84" fill="url(#sp-node)" stroke="#0ea5e9" stroke-width="0.7" opacity="0.9"/>
  <ellipse cx="325" cy="213" rx="62" ry="12" fill="#0369a1" stroke="#0ea5e9" stroke-width="0.7" opacity="0.95"/>
  <ellipse cx="325" cy="297" rx="62" ry="12" fill="#075985" stroke="#0ea5e9" stroke-width="0.7" opacity="0.8"/>
  <text x="325" y="248" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#38bdf8" font-weight="700" letter-spacing="1">AWS S3</text>
  <text x="325" y="265" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#64748b" letter-spacing="1">RAW · JSON</text>
  <text x="325" y="280" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#4e7192">parquet store</text>

  <!-- STAGE 3: Airflow circle r=75, center(535, 255) -->
  <circle cx="535" cy="255" r="70" fill="url(#sp-node)" stroke="#0ea5e9" stroke-width="0.8" opacity="0.95"/>
  <!-- DAG wheel: 6 spokes from center -->
  <line x1="535" y1="255" x2="535" y2="212" stroke="#0ea5e9" stroke-width="0.8" opacity="0.5"/>
  <line x1="535" y1="255" x2="572" y2="234" stroke="#0ea5e9" stroke-width="0.8" opacity="0.5"/>
  <line x1="535" y1="255" x2="572" y2="276" stroke="#0ea5e9" stroke-width="0.8" opacity="0.5"/>
  <line x1="535" y1="255" x2="535" y2="298" stroke="#0ea5e9" stroke-width="0.8" opacity="0.5"/>
  <line x1="535" y1="255" x2="498" y2="276" stroke="#0ea5e9" stroke-width="0.8" opacity="0.5"/>
  <line x1="535" y1="255" x2="498" y2="234" stroke="#0ea5e9" stroke-width="0.8" opacity="0.5"/>
  <!-- Spoke endpoint dots -->
  <circle cx="535" cy="212" r="4" fill="#0ea5e9" opacity="0.7"/>
  <circle cx="572" cy="234" r="4" fill="#0ea5e9" opacity="0.7"/>
  <circle cx="572" cy="276" r="4" fill="#0ea5e9" opacity="0.7"/>
  <circle cx="535" cy="298" r="4" fill="#0ea5e9" opacity="0.7"/>
  <circle cx="498" cy="276" r="4" fill="#0ea5e9" opacity="0.7"/>
  <circle cx="498" cy="234" r="4" fill="#0ea5e9" opacity="0.7"/>
  <!-- Center hub -->
  <circle cx="535" cy="255" r="8" fill="#38bdf8" opacity="0.4"/>
  <circle cx="535" cy="255" r="4" fill="#38bdf8" opacity="0.8"/>
  <text x="535" y="320" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#38bdf8" font-weight="700" letter-spacing="1">AIRFLOW</text>
  <text x="535" y="336" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#64748b" letter-spacing="1">DAILY BATCH · ASTRONOMER</text>

  <!-- STAGE 4: DuckDB + dbt stacked, center x=755 -->
  <!-- DuckDB cylinder bottom -->
  <rect x="688" y="248" width="134" height="60" fill="url(#sp-node)" stroke="#0ea5e9" stroke-width="0.7" opacity="0.9"/>
  <ellipse cx="755" cy="248" rx="67" ry="12" fill="#0369a1" stroke="#0ea5e9" stroke-width="0.7" opacity="0.95"/>
  <ellipse cx="755" cy="308" rx="67" ry="12" fill="#075985" stroke="#0ea5e9" stroke-width="0.7" opacity="0.8"/>
  <text x="755" y="278" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#38bdf8" font-weight="700" letter-spacing="1">DUCKDB</text>
  <!-- dbt hexagon top -->
  <!-- hex center (755, 200), r=44: 799,200 777,162 733,162 711,200 733,238 777,238 -->
  <polygon points="799,200 777,162 733,162 711,200 733,238 777,238" fill="url(#sp-node)" stroke="#38bdf8" stroke-width="1" opacity="0.95"/>
  <text x="755" y="196" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#38bdf8" font-weight="700" letter-spacing="1">dbt</text>
  <text x="755" y="211" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#64748b">transform</text>
  <!-- connection line between them -->
  <line x1="755" y1="238" x2="755" y2="248" stroke="#0ea5e9" stroke-width="1" opacity="0.5"/>
  <text x="755" y="333" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#64748b" letter-spacing="1">SILVER · GOLD</text>

  <!-- STAGE 5: Power BI dashboard rect, center x=980 -->
  <rect x="910" y="190" width="150" height="130" rx="8" fill="url(#sp-node)" stroke="#0ea5e9" stroke-width="0.8" opacity="0.95"/>
  <text x="985" y="215" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#38bdf8" font-weight="700" letter-spacing="1">POWER BI</text>
  <text x="985" y="232" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#64748b" letter-spacing="1">REPORTING</text>
  <!-- Bar chart bars -->
  <rect x="924" y="305" width="22" height="50" rx="2" fill="#0ea5e9" opacity="0.5"/>
  <rect x="952" y="275" width="22" height="80" rx="2" fill="#0ea5e9" opacity="0.65"/>
  <rect x="980" y="285" width="22" height="70" rx="2" fill="#38bdf8" opacity="0.7"/>
  <rect x="1008" y="258" width="22" height="97" rx="2" fill="#38bdf8" opacity="0.8"/>
  <rect x="1036" y="270" width="22" height="85" rx="2" fill="#0ea5e9" opacity="0.55"/>
  <!-- Bar chart baseline -->
  <line x1="920" y1="355" x2="1062" y2="355" stroke="#0ea5e9" stroke-width="0.5" opacity="0.4"/>

  <!-- MEDALLION LABELS below pipe (y=370-400) -->
  <line x1="100" y1="370" x2="1100" y2="370" stroke="#0ea5e9" stroke-width="0.4" stroke-dasharray="4,6" opacity="0.2"/>

  <!-- RAW pill -->
  <rect x="80" y="380" width="70" height="26" rx="13" fill="#0a1628" stroke="#38bdf8" stroke-width="0.8" opacity="0.8"/>
  <text x="115" y="397" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#38bdf8" letter-spacing="1.5">RAW</text>

  <!-- BRONZE pill -->
  <rect x="260" y="380" width="90" height="26" rx="13" fill="#0a1628" stroke="#f59e0b" stroke-width="0.8" opacity="0.7"/>
  <text x="305" y="397" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#f59e0b" letter-spacing="1.5">BRONZE</text>

  <!-- SILVER pill -->
  <rect x="470" y="380" width="90" height="26" rx="13" fill="#0a1628" stroke="#94a3b8" stroke-width="0.8" opacity="0.7"/>
  <text x="515" y="397" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#94a3b8" letter-spacing="1.5">SILVER</text>

  <!-- GOLD pill -->
  <rect x="680" y="380" width="80" height="26" rx="13" fill="#0a1628" stroke="#fbbf24" stroke-width="0.8" opacity="0.7"/>
  <text x="720" y="397" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#fbbf24" letter-spacing="1.5">GOLD</text>

  <!-- REPORTING pill -->
  <rect x="900" y="380" width="110" height="26" rx="13" fill="#0a1628" stroke="#10b981" stroke-width="0.8" opacity="0.7"/>
  <text x="955" y="397" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#10b981" letter-spacing="1.5">REPORTING</text>

  <!-- Metric cards -->
  <rect x="60"  y="435" width="110" height="52" rx="6" fill="#0a1628" stroke="#0ea5e9" stroke-width="0.6" opacity="0.9"/>
  <text x="115" y="459" text-anchor="middle" font-family="ui-monospace,monospace" font-size="20" fill="#38bdf8" font-weight="700">5</text>
  <text x="115" y="476" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#4e7192" letter-spacing="1.5">STAGES</text>

  <rect x="190" y="435" width="110" height="52" rx="6" fill="#0a1628" stroke="#0ea5e9" stroke-width="0.6" opacity="0.9"/>
  <text x="245" y="459" text-anchor="middle" font-family="ui-monospace,monospace" font-size="15" fill="#38bdf8" font-weight="700">DAILY</text>
  <text x="245" y="476" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#4e7192" letter-spacing="1.5">ORCHESTRATION</text>

  <rect x="320" y="435" width="130" height="52" rx="6" fill="#0a1628" stroke="#f59e0b" stroke-width="0.6" opacity="0.9"/>
  <text x="385" y="459" text-anchor="middle" font-family="ui-monospace,monospace" font-size="15" fill="#f59e0b" font-weight="700">S3 + IaC</text>
  <text x="385" y="476" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#4e7192" letter-spacing="1.5">TERRAFORM</text>

  <rect x="470" y="435" width="130" height="52" rx="6" fill="#0a1628" stroke="#10b981" stroke-width="0.6" opacity="0.9"/>
  <text x="535" y="459" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" fill="#10b981" font-weight="700">PARQUET</text>
  <text x="535" y="476" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#4e7192" letter-spacing="1.5">COLUMNAR FORMAT</text>

  <!-- Bottom bar -->
  <rect x="0" y="575" width="1200" height="55" fill="#010b15" opacity="0.85"/>
  <line x1="0" y1="575" x2="1200" y2="575" stroke="#0ea5e9" stroke-width="0.5" opacity="0.25"/>
  <text x="60"  y="607" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#38bdf8" letter-spacing="1.5" opacity="0.8">AWS</text>
  <text x="94"  y="607" font-family="ui-monospace,monospace" font-size="9" fill="#4e7192">·</text>
  <text x="108" y="607" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#38bdf8" letter-spacing="1.5" opacity="0.8">AIRFLOW</text>
  <text x="178" y="607" font-family="ui-monospace,monospace" font-size="9" fill="#4e7192">·</text>
  <text x="192" y="607" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#38bdf8" letter-spacing="1.5" opacity="0.8">DUCKDB</text>
  <text x="256" y="607" font-family="ui-monospace,monospace" font-size="9" fill="#4e7192">·</text>
  <text x="270" y="607" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#38bdf8" letter-spacing="1.5" opacity="0.8">DBT</text>
  <text x="304" y="607" font-family="ui-monospace,monospace" font-size="9" fill="#4e7192">·</text>
  <text x="318" y="607" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#38bdf8" letter-spacing="1.5" opacity="0.8">TERRAFORM</text>
  <text x="410" y="607" font-family="ui-monospace,monospace" font-size="9" fill="#4e7192">·</text>
  <text x="424" y="607" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#38bdf8" letter-spacing="1.5" opacity="0.8">S3</text>
  <text x="448" y="607" font-family="ui-monospace,monospace" font-size="9" fill="#4e7192">·</text>
  <text x="462" y="607" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#38bdf8" letter-spacing="1.5" opacity="0.8">POWER BI</text>
</svg>
