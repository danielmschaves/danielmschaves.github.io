<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="dip-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#031a0e"/>
      <stop offset="100%" stop-color="#0a2918"/>
    </linearGradient>
    <pattern id="dip-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" stroke="#22c55e" stroke-width="0.4"/>
    </pattern>
    <filter id="dip-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
      <feFlood flood-color="#22c55e" flood-opacity="0.45" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dip-glow-amber" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feFlood flood-color="#d97706" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#dip-bg)"/>
  <rect width="1200" height="630" fill="url(#dip-grid)" opacity="0.07"/>

  <!-- Ambient glow -->
  <ellipse cx="600" cy="320" rx="480" ry="200" fill="#15803d" opacity="0.06"/>

  <!-- HEADER -->
  <text x="600" y="52" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="22" fill="#f1f5f9" font-weight="600" letter-spacing="1">DATA INTELLIGENCE PLATFORM</text>
  <text x="600" y="76" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="11" fill="#22c55e" letter-spacing="2">12 MONTHS · TRADING COMPANY · PROJECT MANAGEMENT</text>

  <!-- Horizontal divider -->
  <line x1="120" y1="96" x2="1080" y2="96" stroke="#15803d" stroke-width="0.8" opacity="0.5"/>

  <!-- Quarterly phase labels -->
  <text x="210" y="122" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="10" fill="#86efac" letter-spacing="1">Q1 · PLANNING</text>
  <text x="450" y="122" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="10" fill="#86efac" letter-spacing="1">Q2 · MVP</text>
  <text x="690" y="122" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="10" fill="#86efac" letter-spacing="1">Q3 · DEPLOY</text>
  <text x="930" y="122" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="10" fill="#86efac" letter-spacing="1">Q4 · MONITOR</text>

  <!-- Phase timeline spine -->
  <line x1="120" y1="140" x2="1080" y2="140" stroke="#15803d" stroke-width="2"/>
  <!-- Phase nodes -->
  <circle cx="210" cy="140" r="10" fill="#052e16" stroke="#22c55e" stroke-width="2" filter="url(#dip-glow)"/>
  <text x="210" cy="140" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#22c55e" y="144">01</text>
  <circle cx="450" cy="140" r="10" fill="#052e16" stroke="#22c55e" stroke-width="2" filter="url(#dip-glow)"/>
  <text x="450" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#22c55e" y="144">02</text>
