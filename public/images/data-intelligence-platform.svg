  <text x="600" y="76" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="11" fill="#38bdf8" letter-spacing="2">12 MONTHS · TRADING COMPANY · PROJECT MANAGEMENT</text>

