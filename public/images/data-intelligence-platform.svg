  <text x="600" y="498" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="10" fill="#4b5563" letter-spacing="1">HYBRID AGILE · SCRUM + KANBAN · SPRINT PLANNING · BACKLOG MANAGEMENT</text>
  <text x="600" y="518" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="10" fill="#374151" letter-spacing="0.5">danielmschaves.com</text>
