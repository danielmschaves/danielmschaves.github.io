  <line x1="222" y1="295" x2="295" y2="295" stroke="#a78bfa" stroke-width="1.5" opacity="0.5" marker-end="url(#hp-arr)"/>
  <line x1="510" y1="295" x2="570" y2="295" stroke="#a78bfa" stroke-width="1.5" opacity="0.5" marker-end="url(#hp-arr)"/>
  <line x1="860" y1="295" x2="930" y2="295" stroke="#a78bfa" stroke-width="1.5" opacity="0.5" marker-end="url(#hp-arr)"/>

