<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="hp-bg" x1="0" y1="0" x2="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020e1a"/>
      <stop offset="100%" stop-color="#0d0f2e"/>
    </linearGradient>
    <pattern id="hp-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" stroke="#8b5cf6" stroke-width="0.4"/>
    </pattern>
    <marker id="hp-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#a78bfa" opacity="0.6"/>
    </marker>
    <linearGradient id="hp-node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f0c2e"/>
    </linearGradient>
    <linearGradient id="hp-reg-line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#hp-bg)"/>
  <rect width="1200" height="630" fill="url(#hp-grid)" opacity="0.06"/>

