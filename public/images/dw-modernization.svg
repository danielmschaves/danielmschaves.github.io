  <!-- Hexagon shape for dbt -->
  <polygon points="432,215 498,253 498,317 432,355 366,317 366,253" fill="url(#dw-node2)" stroke="#0ea5e9" stroke-width="0.8" opacity="0.95"/>
  <!-- Inner hexagon detail -->
  <polygon points="432,232 484,260 484,310 432,338 380,310 380,260" fill="none" stroke="#0ea5e9" stroke-width="0.4" opacity="0.3"/>
  <!-- Label -->
  <text x="432" y="279" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" fill="#38bdf8" font-weight="700">dbt</text>
