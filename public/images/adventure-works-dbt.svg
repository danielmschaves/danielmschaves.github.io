<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="aw-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020e1a"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="aw-pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="aw-n1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="aw-n2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="aw-n3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="aw-n4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <pattern id="aw-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" stroke="#0ea5e9" stroke-width="0.4"/>
    </pattern>
    <filter id="aw-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="blur"/>
      <feFlood flood-color="#0ea5e9" flood-opacity="0.55" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#aw-bg)"/>
  <rect width="1200" height="630" fill="url(#aw-grid)" opacity="0.07"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="22" fill="#f1f5f9" font-weight="600" letter-spacing="0.5">Adventure Works · dbt Pipeline</text>
  <text x="600" y="62" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="11" fill="#38bdf8" letter-spacing="2" opacity="0.85">dbt Core · BigQuery · Analytics Engineering · Indicium Academy</text>

  <!-- Pipeline backbone -->
  <rect x="168" y="280" width="864" height="10" rx="5" fill="#0c4a6e" opacity="0.6"/>
  <circle cx="280" cy="285" r="3" fill="#0369a1" opacity="0.7"/>
  <circle cx="360" cy="285" r="3" fill="#0469a8" opacity="0.8"/>
  <circle cx="440" cy="285" r="4" fill="#0569b0" opacity="0.9"/>
  <circle cx="520" cy="285" r="3" fill="#0679ba" opacity="0.8"/>
  <circle cx="600" cy="285" r="5" fill="#0ea5e9"/>
  <circle cx="680" cy="285" r="3" fill="#16b1f0" opacity="0.8"/>
  <circle cx="760" cy="285" r="3" fill="#22c4f4" opacity="0.9"/>
  <circle cx="840" cy="285" r="4" fill="#2dcff7" opacity="0.8"/>
  <circle cx="920" cy="285" r="3" fill="#38bdf8" opacity="0.7"/>

  <!-- NODE 1: SAP SOURCE (cx=168) — Cylinder -->
  <rect x="88" y="220" width="160" height="130" rx="8" fill="url(#aw-n1)" stroke="#0ea5e9" stroke-width="0.8" filter="url(#aw-glow)"/>
  <ellipse cx="168" cy="224" rx="80" ry="12" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="0.6"/>
  <ellipse cx="168" cy="224" rx="80" ry="12" fill="#075985" opacity="0.5"/>
  <ellipse cx="168" cy="285" rx="80" ry="8" fill="none" stroke="#0ea5e9" stroke-width="0.4" opacity="0.3"/>
  <text x="168" y="258" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#38bdf8" font-weight="700" letter-spacing="0.5">SAP SOURCE</text>
  <text x="168" y="276" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#e2e8f0" letter-spacing="1">LEGACY ERP</text>
  <text x="168" y="318" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#e2e8f0" letter-spacing="0.5">64 TABLES</text>
  <text x="168" y="375" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#38bdf8" opacity="0.6" letter-spacing="2">STAGE 1</text>
  <text x="168" y="391" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#e2e8f0">SOURCE</text>

  <!-- Arrow 1→2 -->
  <line x1="252" y1="285" x2="348" y2="285" stroke="url(#aw-pipe)" stroke-width="2" opacity="0.7"/>
  <polygon points="352,285 340,278 340,292" fill="#0ea5e9" opacity="0.8"/>
  <text x="300" y="272" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#e2e8f0" letter-spacing="1">EXTRACT</text>

  <!-- NODE 2: STAGING (cx=432) — Hexagon -->
  <polygon points="432,215 498,253 498,317 432,355 366,317 366,253" fill="url(#aw-n2)" stroke="#0ea5e9" stroke-width="0.8" filter="url(#aw-glow)"/>
  <polygon points="432,232 484,260 484,310 432,338 380,310 380,260" fill="none" stroke="#0ea5e9" stroke-width="0.4" opacity="0.3"/>
  <text x="432" y="273" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" fill="#38bdf8" font-weight="700">STAGING</text>
  <text x="432" y="293" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#e2e8f0" letter-spacing="1">standardize · clean</text>
  <text x="432" y="312" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#e2e8f0" letter-spacing="0.5">type cast · validate</text>
  <text x="432" y="375" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#38bdf8" opacity="0.6" letter-spacing="2">STAGE 2</text>
  <text x="432" y="391" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#e2e8f0">STAGING</text>

  <!-- Arrow 2→3 -->
  <line x1="502" y1="285" x2="598" y2="285" stroke="url(#aw-pipe)" stroke-width="2" opacity="0.7"/>
  <polygon points="602,285 590,278 590,292" fill="#0ea5e9" opacity="0.8"/>
  <text x="550" y="272" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#e2e8f0" letter-spacing="1">TRANSFORM</text>

  <!-- NODE 3: MARTS via dbt (cx=696) — Larger Hexagon -->
  <polygon points="696,215 768,256 768,320 696,360 624,320 624,256" fill="url(#aw-n3)" stroke="#0ea5e9" stroke-width="0.8" filter="url(#aw-glow)"/>
  <line x1="696" y1="240" x2="696" y2="336" stroke="#0ea5e9" stroke-width="0.5" opacity="0.25"/>
  <line x1="628" y1="270" x2="764" y2="306" stroke="#0ea5e9" stroke-width="0.5" opacity="0.25"/>
  <line x1="764" y1="270" x2="628" y2="306" stroke="#0ea5e9" stroke-width="0.5" opacity="0.25"/>
  <text x="696" y="270" text-anchor="middle" font-family="ui-monospace,monospace" font-size="15" fill="#38bdf8" font-weight="700">MARTS</text>
  <text x="696" y="291" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#e2e8f0" letter-spacing="1">via dbt Core</text>
  <text x="696" y="311" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#e2e8f0" letter-spacing="0.5">dim · fact · metrics</text>
  <text x="696" y="375" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#38bdf8" opacity="0.6" letter-spacing="2">STAGE 3</text>
  <text x="696" y="391" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#e2e8f0">DATA MART</text>

  <!-- Arrow 3→4 -->
  <line x1="770" y1="285" x2="866" y2="285" stroke="url(#aw-pipe)" stroke-width="2" opacity="0.7"/>
  <polygon points="870,285 858,278 858,292" fill="#0ea5e9" opacity="0.8"/>
  <text x="818" y="272" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#e2e8f0" letter-spacing="1">LOAD</text>

  <!-- NODE 4: BIGQUERY (cx=1000) — Rect with chart bars -->
  <rect x="912" y="215" width="176" height="140" rx="8" fill="url(#aw-n4)" stroke="#0ea5e9" stroke-width="0.8" filter="url(#aw-glow)"/>
  <polygon points="1000,232 1020,257 1000,282 980,257" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
  <polygon points="1000,242 1015,257 1000,272 985,257" fill="#0ea5e9" opacity="0.2"/>
  <rect x="932" y="293" width="18" height="47" rx="2" fill="#075985" opacity="0.9"/>
  <rect x="957" y="273" width="18" height="67" rx="2" fill="#0284c7" opacity="0.9"/>
  <rect x="982" y="281" width="18" height="59" rx="2" fill="#0369a1" opacity="0.9"/>
  <rect x="1007" y="261" width="18" height="79" rx="2" fill="#0ea5e9" opacity="0.9"/>
  <rect x="1032" y="277" width="18" height="63" rx="2" fill="#38bdf8" opacity="0.9"/>
  <line x1="925" y1="340" x2="1062" y2="340" stroke="#0ea5e9" stroke-width="0.6" opacity="0.5"/>
  <text x="1000" y="234" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#38bdf8" font-weight="700" letter-spacing="0.5">BIGQUERY</text>
  <text x="1000" y="375" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#38bdf8" opacity="0.6" letter-spacing="2">STAGE 4</text>
  <text x="1000" y="391" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#e2e8f0">ANALYTICS &amp; REPORTING</text>

  <!-- KPI Row -->
  <rect x="88"  y="420" width="158" height="56" rx="6" fill="#075985" stroke="#0ea5e9" stroke-width="0.7" filter="url(#aw-glow)"/>
  <text x="167" y="445" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" fill="#38bdf8" font-weight="700">64</text>
  <text x="167" y="463" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#e2e8f0" letter-spacing="1">SAP SOURCE TABLES</text>

  <rect x="284" y="420" width="158" height="56" rx="6" fill="#075985" stroke="#10b981" stroke-width="0.7" filter="url(#aw-glow)"/>
  <text x="363" y="445" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" fill="#10b981" font-weight="700">3</text>
  <text x="363" y="463" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#e2e8f0" letter-spacing="1">dbt LAYERS</text>

  <rect x="480" y="420" width="158" height="56" rx="6" fill="#075985" stroke="#10b981" stroke-width="0.7" filter="url(#aw-glow)"/>
  <text x="559" y="445" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" fill="#10b981" font-weight="700">100%</text>
  <text x="559" y="463" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#e2e8f0" letter-spacing="1">TESTS PASSING</text>

  <rect x="676" y="420" width="158" height="56" rx="6" fill="#075985" stroke="#0ea5e9" stroke-width="0.7" filter="url(#aw-glow)"/>
  <text x="755" y="445" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#38bdf8" font-weight="700">ANALYTICS</text>
  <text x="755" y="463" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#e2e8f0" letter-spacing="1">ENGINEER CERT</text>

  <rect x="872" y="420" width="240" height="56" rx="6" fill="#075985" stroke="#0ea5e9" stroke-width="0.7" filter="url(#aw-glow)"/>
  <text x="992" y="445" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#38bdf8" font-weight="700">INDICIUM ACADEMY</text>
  <text x="992" y="463" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#e2e8f0" letter-spacing="1">ANALYTICS ENGINEERING CERTIFICATION</text>

  <!-- Bottom bar -->
  <rect x="0" y="575" width="1200" height="55" fill="#010b15" opacity="0.85"/>
  <line x1="0" y1="575" x2="1200" y2="575" stroke="#0ea5e9" stroke-width="0.5" opacity="0.25"/>
  <text x="60"  y="607" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#38bdf8" letter-spacing="1.5" opacity="0.8">DBT</text>
  <text x="94"  y="607" font-family="ui-monospace,monospace" font-size="9" fill="#e2e8f0">·</text>
  <text x="108" y="607" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#38bdf8" letter-spacing="1.5" opacity="0.8">BIGQUERY</text>
  <text x="186" y="607" font-family="ui-monospace,monospace" font-size="9" fill="#e2e8f0">·</text>
  <text x="200" y="607" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#38bdf8" letter-spacing="1.5" opacity="0.8">SQL</text>
  <text x="232" y="607" font-family="ui-monospace,monospace" font-size="9" fill="#e2e8f0">·</text>
  <text x="246" y="607" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#38bdf8" letter-spacing="1.5" opacity="0.8">PYTHON</text>
  <text x="310" y="607" font-family="ui-monospace,monospace" font-size="9" fill="#e2e8f0">·</text>
  <text x="324" y="607" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#38bdf8" letter-spacing="1.5" opacity="0.8">DATA MODELING</text>
</svg>
