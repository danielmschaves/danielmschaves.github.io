  <text x="600" y="62" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="11" fill="#a78bfa" letter-spacing="2" opacity="0.85">Python · Machine Learning · Regression · Predictive Modeling</text>

  <!-- Pipeline backbone -->
  <line x1="220" y1="295" x2="980" y2="295" stroke="#4c1d95" stroke-width="2.5" opacity="0.35"/>

