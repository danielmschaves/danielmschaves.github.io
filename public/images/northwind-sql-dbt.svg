  <!-- Whale tail -->
  <path d="M334,230 Q320,215 316,228 Q320,241 334,234" fill="none" stroke="#2496ed" stroke-width="1" opacity="0.4"/>
  <!-- Containers on whale (little boxes) -->
  <rect x="352" y="215" width="18" height="14" rx="2" fill="#2496ed" opacity="0.35"/>
  <rect x="374" y="215" width="18" height="14" rx="2" fill="#2496ed" opacity="0.35"/>
  <rect x="396" y="215" width="18" height="14" rx="2" fill="#2496ed" opacity="0.35"/>
  <rect x="363" y="204" width="18" height="12" rx="2" fill="#2496ed" opacity="0.25"/>
  <rect x="385" y="204" width="18" height="12" rx="2" fill="#2496ed" opacity="0.25"/>
  <!-- Container services -->
  <text x="389" y="266" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#38bdf8" letter-spacing="1">CONTAINER SERVICES</text>
