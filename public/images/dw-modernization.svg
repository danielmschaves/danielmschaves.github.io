  <text x="167" y="445" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" fill="#38bdf8" font-weight="700">&lt; 5%</text>
  <text x="167" y="463" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7"  fill="#4e7192" letter-spacing="1">VARIANCE TO BUDGET</text>

  <rect x="284" y="420" width="158" height="56" rx="6" fill="#075985" stroke="#10b981" stroke-width="0.7" opacity="0.9"/>
  <text x="363" y="445" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" fill="#10b981" font-weight="700">100%</text>
  <text x="363" y="463" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7"  fill="#4e7192" letter-spacing="1">GATEWAYS PASSED</text>

  <rect x="480" y="420" width="158" height="56" rx="6" fill="#075985" stroke="#0ea5e9" stroke-width="0.7" opacity="0.9"/>
  <text x="559" y="445" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" fill="#38bdf8" font-weight="700">&gt; 98%</text>
  <text x="559" y="463" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7"  fill="#4e7192" letter-spacing="1">DATA ACCURACY SLA</text>

  <rect x="676" y="420" width="158" height="56" rx="6" fill="#075985" stroke="#0ea5e9" stroke-width="0.7" opacity="0.9"/>
  <text x="755" y="445" text-anchor="middle" font-family="ui-monospace,monospace" font-size="18" fill="#38bdf8" font-weight="700">4</text>
  <text x="755" y="463" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7"  fill="#4e7192" letter-spacing="1">CONTRACTUAL GATEWAYS</text>

  <rect x="872" y="420" width="240" height="56" rx="6" fill="#075985" stroke="#0ea5e9" stroke-width="0.7" opacity="0.9"/>
  <text x="992" y="445" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" fill="#38bdf8" font-weight="700">3-TIER GOVERNANCE</text>
  <text x="992" y="463" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7"  fill="#4e7192" letter-spacing="1">STRATEGIC · TACTICAL · OPERATIONAL</text>

  <!-- ── BOTTOM BAR ── -->
