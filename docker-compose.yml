version: '3.8'

services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # Mount public/images so images update without a full rebuild
      - ./public/images:/app/public/images:ro
      # Prevent host node_modules from overriding the container's
      - /app/node_modules
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  playwright:
    image: mcr.microsoft.com/playwright:v1.59.1-noble
    working_dir: /app
    volumes:
      - .:/app
    command: >
      sh -c "npm install && npx playwright test"
    depends_on:
      - portfolio
    environment:
      - BASE_URL=http://portfolio:3000
    profiles:
      - test
