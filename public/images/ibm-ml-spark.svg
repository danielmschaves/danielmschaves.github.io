      <stop offset="0%" stop-color="#020e1a"/>
      <stop offset="100%" stop-color="#0d0f2e"/>
    </linearGradient>
    <pattern id="ml-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" stroke="#8b5cf6" stroke-width="0.4"/>
    </pattern>
    <marker id="ml-arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#a78bfa" opacity="0.6"/>
    </marker>
    <linearGradient id="ml-node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f0c2e"/>
    </linearGradient>
    <linearGradient id="ml-spark-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d1a00"/>
      <stop offset="100%" stop-color="#1a0a00"/>
    </linearGradient>
    <linearGradient id="ml-tree-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2e10"/>
      <stop offset="100%" stop-color="#0a1808"/>
