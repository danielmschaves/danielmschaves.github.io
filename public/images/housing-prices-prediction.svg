  <circle cx="255" cy="295" r="4" fill="#a78bfa" opacity="0.7"/>
  <circle cx="272" cy="295" r="3.5" fill="#8b5cf6" opacity="0.5"/>

  <circle cx="526" cy="295" r="3.5" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="543" cy="295" r="4" fill="#a78bfa" opacity="0.7"/>
  <circle cx="559" cy="295" r="3.5" fill="#8b5cf6" opacity="0.5"/>

  <circle cx="877" cy="295" r="3.5" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="895" cy="295" r="4" fill="#a78bfa" opacity="0.7"/>
  <circle cx="912" cy="295" r="3.5" fill="#8b5cf6" opacity="0.5"/>

  <!-- STAGE 1: Feature Input Panel x=40-220, y=120-470 -->
  <rect x="40" y="120" width="182" height="350" rx="8" fill="url(#hp-node)" stroke="#a78bfa" stroke-width="0.8" opacity="0.95"/>
