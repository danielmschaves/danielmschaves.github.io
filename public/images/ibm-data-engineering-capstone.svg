  <!-- 980,307 940,238 860,238 820,307 860,376 940,376 -->
  <polygon points="980,307 940,238 860,238 820,307 860,376 940,376" fill="url(#ic-spark)" stroke="#f97316" stroke-width="1" opacity="0.95"/>
  <!-- Spark flame shape inside -->
  <path d="M900,253 Q920,265 910,275 Q930,268 920,285 Q940,272 925,295 Q915,310 900,310 Q885,310 875,295 Q860,272 880,285 Q870,268 890,275 Q880,265 900,253 Z" fill="#f97316" opacity="0.35"/>
  <text x="900" y="328" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#f97316" font-weight="700" letter-spacing="1">SPARK</text>
  <text x="900" y="345" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#64748b" letter-spacing="1">ML PIPELINE</text>
  <text x="900" y="360" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#64748b">predictive model</text>

  <!-- Arrow Spark to Analytics -->
  <line x1="982" y1="307" x2="1050" y2="307" stroke="#0ea5e9" stroke-width="1.5" opacity="0.5" marker-end="url(#ic-arr)"/>
  <circle cx="1000" cy="307" r="3.5" fill="#0ea5e9" opacity="0.5"/>
  <circle cx="1020" cy="307" r="4" fill="#38bdf8" opacity="0.7"/>
  <circle cx="1040" cy="307" r="3.5" fill="#0ea5e9" opacity="0.5"/>

  <!-- Analytics dashboard rect -->
  <rect x="1060" y="215" width="130" height="185" rx="8" fill="url(#ic-node)" stroke="#38bdf8" stroke-width="0.8" opacity="0.95"/>
  <text x="1125" y="240" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#38bdf8" letter-spacing="2">ANALYTICS</text>
  <line x1="1070" y1="247" x2="1180" y2="247" stroke="#0ea5e9" stroke-width="0.4" opacity="0.3"/>
  <!-- Bar chart bars -->
  <rect x="1074" y="320" width="18" height="70" rx="2" fill="#0ea5e9" opacity="0.5"/>
  <rect x="1098" y="290" width="18" height="100" rx="2" fill="#0ea5e9" opacity="0.65"/>
  <rect x="1122" y="300" width="18" height="90" rx="2" fill="#38bdf8" opacity="0.7"/>
  <rect x="1146" y="268" width="18" height="122" rx="2" fill="#38bdf8" opacity="0.8"/>
  <line x1="1070" y1="390" x2="1180" y2="390" stroke="#0ea5e9" stroke-width="0.5" opacity="0.4"/>
