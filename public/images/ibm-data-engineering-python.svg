  <text x="600" y="62" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="11" fill="#38bdf8" letter-spacing="2" opacity="0.85">Web Scraping · APIs · Python · Financial Analysis · IBM</text>

  <!-- ── LEFT: 3 SOURCE NODES stacked ── -->
