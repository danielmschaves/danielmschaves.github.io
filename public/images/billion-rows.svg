<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="br-bg" x1="0" y1="0" x2="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020e1a"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <pattern id="br-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" stroke="#0ea5e9" stroke-width="0.4"/>
    </pattern>
    <linearGradient id="br-pandas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="br-polars" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="br-duck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#br-bg)"/>
  <rect width="1200" height="630" fill="url(#br-grid)" opacity="0.07"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="22" fill="#f1f5f9" font-weight="600" letter-spacing="0.5">Billion Row Challenge</text>
  <text x="600" y="62" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="11" fill="#38bdf8" letter-spacing="2" opacity="0.85">Pandas · Polars · DuckDB · Streamlit · Python</text>

  <!-- DATA SOURCE TABLE (y=82-245) -->
  <rect x="48" y="82" width="1104" height="163" rx="6" fill="#030d18" stroke="#0ea5e9" stroke-width="0.6" opacity="0.9"/>

  <!-- Watermark "1,000,000,000" -->
  <text x="600" y="190" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="72" fill="#0ea5e9" opacity="0.06" font-weight="700" letter-spacing="-1">1,000,000,000</text>

  <!-- Table header row -->
  <rect x="48" y="82" width="1104" height="22" rx="0" fill="#0369a1" opacity="0.4"/>
  <text x="120"  y="97" font-family="ui-monospace,monospace" font-size="8" fill="#38bdf8" letter-spacing="1.5">STATION_ID</text>
  <text x="250"  y="97" font-family="ui-monospace,monospace" font-size="8" fill="#38bdf8" letter-spacing="1.5">TIMESTAMP</text>
  <text x="400"  y="97" font-family="ui-monospace,monospace" font-size="8" fill="#38bdf8" letter-spacing="1.5">TEMPERATURE</text>
  <text x="560"  y="97" font-family="ui-monospace,monospace" font-size="8" fill="#38bdf8" letter-spacing="1.5">PRECIPITATION</text>
  <text x="730"  y="97" font-family="ui-monospace,monospace" font-size="8" fill="#38bdf8" letter-spacing="1.5">WIND_SPEED</text>
  <text x="900"  y="97" font-family="ui-monospace,monospace" font-size="8" fill="#38bdf8" letter-spacing="1.5">HUMIDITY</text>
  <text x="1040" y="97" font-family="ui-monospace,monospace" font-size="8" fill="#38bdf8" letter-spacing="1.5">PRESSURE</text>

  <!-- Table rows (alternating, fading opacity) -->
  <!-- Row 1 -->
  <rect x="52" y="106" width="1096" height="14" rx="0" fill="#0a1628" opacity="0.6"/>
  <text x="120"  y="117" font-family="ui-monospace,monospace" font-size="8" fill="#64748b">STN-00042</text>
  <text x="250"  y="117" font-family="ui-monospace,monospace" font-size="8" fill="#64748b">2024-01-01 00:00</text>
  <text x="400"  y="117" font-family="ui-monospace,monospace" font-size="8" fill="#64748b">21.4°C</text>
  <text x="560"  y="117" font-family="ui-monospace,monospace" font-size="8" fill="#64748b">0.0 mm</text>
  <text x="730"  y="117" font-family="ui-monospace,monospace" font-size="8" fill="#64748b">12.3 km/h</text>
  <text x="900"  y="117" font-family="ui-monospace,monospace" font-size="8" fill="#64748b">65%</text>
  <text x="1040" y="117" font-family="ui-monospace,monospace" font-size="8" fill="#64748b">1013.2 hPa</text>
  <!-- Row 2 -->
  <rect x="52" y="122" width="1096" height="14" rx="0" fill="#0a1628" opacity="0.3"/>
  <text x="120"  y="133" font-family="ui-monospace,monospace" font-size="8" fill="#4e6070">STN-00891</text>
  <text x="250"  y="133" font-family="ui-monospace,monospace" font-size="8" fill="#4e6070">2024-01-01 00:01</text>
  <!-- Row 3 -->
  <rect x="52" y="138" width="1096" height="14" rx="0" fill="#0a1628" opacity="0.5"/>
  <text x="120"  y="149" font-family="ui-monospace,monospace" font-size="8" fill="#4e6070">STN-01234</text>
  <!-- Row 4 fading -->
  <rect x="52" y="154" width="1096" height="14" rx="0" fill="#0a1628" opacity="0.25"/>
  <!-- Row 5 more faded -->
  <rect x="52" y="170" width="1096" height="14" rx="0" fill="#0a1628" opacity="0.15"/>
  <!-- Rows trailing off -->
  <rect x="52" y="186" width="1096" height="10" rx="0" fill="#0a1628" opacity="0.08"/>
  <rect x="52" y="198" width="1096" height="8" rx="0" fill="#0a1628" opacity="0.05"/>
  <rect x="52" y="208" width="1096" height="6" rx="0" fill="#0a1628" opacity="0.03"/>

  <!-- "1B ROWS" bold label -->
  <text x="600" y="238" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="26" fill="#38bdf8" font-weight="700" letter-spacing="4" opacity="0.9">1B ROWS</text>

  <!-- ── RACE LANES (y=268-545) ── -->
  <!-- Lane container dividers -->
  <line x1="48" y1="268" x2="1152" y2="268" stroke="#0ea5e9" stroke-width="0.5" opacity="0.15"/>
  <line x1="48" y1="375" x2="1152" y2="375" stroke="#0ea5e9" stroke-width="0.5" opacity="0.15"/>
  <line x1="48" y1="462" x2="1152" y2="462" stroke="#0ea5e9" stroke-width="0.5" opacity="0.15"/>

  <!-- Lane background highlights -->
  <rect x="48" y="268" width="1104" height="107" rx="0" fill="#f59e0b" opacity="0.02"/>
  <rect x="48" y="375" width="1104" height="87"  rx="0" fill="#38bdf8" opacity="0.02"/>
  <rect x="48" y="462" width="1104" height="83"  rx="0" fill="#10b981" opacity="0.03"/>

  <!-- ── PANDAS LANE ── -->
  <text x="68" y="302" font-family="ui-monospace,'Courier New',monospace" font-size="14" fill="#f59e0b" font-weight="700" letter-spacing="1">PANDAS</text>
  <text x="68" y="319" font-family="ui-monospace,monospace" font-size="8" fill="#64748b" letter-spacing="1">Python · row-wise · GIL-bound</text>
  <!-- Progress bar track -->
  <rect x="68" y="332" width="940" height="22" rx="4" fill="#0a1628" stroke="#f59e0b" stroke-width="0.5" opacity="0.5"/>
  <!-- Progress fill ~25% -->
  <rect x="68" y="332" width="235" height="22" rx="4" fill="url(#br-pandas)" opacity="0.8"/>
  <!-- Time badge -->
  <rect x="1020" y="328" width="110" height="30" rx="6" fill="#0a1628" stroke="#f59e0b" stroke-width="0.7" opacity="0.9"/>
  <text x="1075" y="348" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#f59e0b" font-weight="700">~180s</text>
  <!-- Progress text -->
  <text x="160" y="348" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#d97706" opacity="0.8">25%</text>

  <!-- ── POLARS LANE ── -->
  <text x="68" y="400" font-family="ui-monospace,'Courier New',monospace" font-size="14" fill="#38bdf8" font-weight="700" letter-spacing="1">POLARS</text>
  <text x="68" y="417" font-family="ui-monospace,monospace" font-size="8" fill="#64748b" letter-spacing="1">Rust-backed · parallel · lazy eval</text>
  <!-- Progress bar track -->
  <rect x="68" y="425" width="940" height="22" rx="4" fill="#0a1628" stroke="#38bdf8" stroke-width="0.5" opacity="0.5"/>
  <!-- Progress fill ~62% -->
  <rect x="68" y="425" width="583" height="22" rx="4" fill="url(#br-polars)" opacity="0.8"/>
  <!-- Time badge -->
  <rect x="1020" y="421" width="110" height="30" rx="6" fill="#0a1628" stroke="#38bdf8" stroke-width="0.7" opacity="0.9"/>
  <text x="1075" y="441" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#38bdf8" font-weight="700">~12s</text>
  <text x="380" y="441" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#38bdf8" opacity="0.8">62%</text>

  <!-- ── DUCKDB LANE ── -->
  <text x="68" y="484" font-family="ui-monospace,'Courier New',monospace" font-size="14" fill="#10b981" font-weight="700" letter-spacing="1">DUCKDB</text>
  <text x="68" y="501" font-family="ui-monospace,monospace" font-size="8" fill="#64748b" letter-spacing="1">vectorized · columnar · in-process</text>
  <!-- Progress bar track -->
  <rect x="68" y="510" width="940" height="22" rx="4" fill="#0a1628" stroke="#10b981" stroke-width="0.5" opacity="0.5"/>
  <!-- Progress fill ~95% -->
  <rect x="68" y="510" width="893" height="22" rx="4" fill="url(#br-duck)" opacity="0.85"/>
  <!-- Trophy + time badge -->
  <rect x="1020" y="506" width="110" height="30" rx="6" fill="#0a1628" stroke="#10b981" stroke-width="0.7" opacity="0.9"/>
  <text x="1048" y="526" font-family="ui-monospace,monospace" font-size="13" fill="#fbbf24" font-weight="700">★</text>
  <text x="1068" y="526" font-family="ui-monospace,monospace" font-size="13" fill="#10b981" font-weight="700">~6s</text>
  <text x="600" y="526" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#065e42" opacity="0.9">95%</text>

  <!-- Streamlit icon bottom right -->
  <rect x="1050" y="452" width="90" height="70" rx="6" fill="#0a1628" stroke="#0ea5e9" stroke-width="0.6" opacity="0.7"/>
  <!-- monitor outline -->
  <rect x="1058" y="458" width="74" height="46" rx="3" fill="none" stroke="#0ea5e9" stroke-width="0.7" opacity="0.6"/>
  <!-- mini bars inside monitor -->
  <rect x="1064" y="480" width="10" height="18" rx="1" fill="#0ea5e9" opacity="0.5"/>
  <rect x="1078" y="472" width="10" height="26" rx="1" fill="#38bdf8" opacity="0.6"/>
  <rect x="1092" y="467" width="10" height="31" rx="1" fill="#38bdf8" opacity="0.7"/>
  <rect x="1106" y="475" width="10" height="23" rx="1" fill="#0ea5e9" opacity="0.5"/>
  <text x="1095" y="515" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#4e7192" letter-spacing="1">STREAMLIT</text>

  <!-- Bottom bar -->
  <rect x="0" y="575" width="1200" height="55" fill="#010b15" opacity="0.85"/>
  <line x1="0" y1="575" x2="1200" y2="575" stroke="#0ea5e9" stroke-width="0.5" opacity="0.25"/>
  <text x="60"  y="607" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#38bdf8" letter-spacing="1.5" opacity="0.8">PYTHON</text>
  <text x="124" y="607" font-family="ui-monospace,monospace" font-size="9" fill="#4e7192">·</text>
  <text x="138" y="607" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#38bdf8" letter-spacing="1.5" opacity="0.8">PANDAS</text>
  <text x="204" y="607" font-family="ui-monospace,monospace" font-size="9" fill="#4e7192">·</text>
  <text x="218" y="607" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#38bdf8" letter-spacing="1.5" opacity="0.8">POLARS</text>
  <text x="280" y="607" font-family="ui-monospace,monospace" font-size="9" fill="#4e7192">·</text>
  <text x="294" y="607" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#38bdf8" letter-spacing="1.5" opacity="0.8">DUCKDB</text>
  <text x="364" y="607" font-family="ui-monospace,monospace" font-size="9" fill="#4e7192">·</text>
  <text x="378" y="607" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#38bdf8" letter-spacing="1.5" opacity="0.8">STREAMLIT</text>
</svg>
