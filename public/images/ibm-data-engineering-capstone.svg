  <text x="125" y="529" text-anchor="middle" font-family="ui-monospace,monospace" font-size="15" fill="#38bdf8" font-weight="700">OLTP+OLAP</text>
  <text x="125" y="546" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#4e7192" letter-spacing="1">DUAL DATABASE</text>

  <rect x="210" y="510" width="130" height="45" rx="6" fill="#0a1628" stroke="#0ea5e9" stroke-width="0.6" opacity="0.9"/>
  <text x="275" y="529" text-anchor="middle" font-family="ui-monospace,monospace" font-size="15" fill="#38bdf8" font-weight="700">ETL</text>
  <text x="275" y="546" text-anchor="middle" font-family="ui-monospace,monospace" font-size="7" fill="#4e7192" letter-spacing="1">DATA PIPELINES</text>

  <rect x="360" y="510" width="130" height="45" rx="6" fill="#0a1628" stroke="#f97316" stroke-width="0.6" opacity="0.9"/>
  <text x="425" y="529" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#f97316" font-weight="700">APACHE</text>
  <text x="425" y="545" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="#f97316" font-weight="700">SPARK</text>

  <rect x="510" y="510" width="130" height="45" rx="6" fill="#0a1628" stroke="#10b981" stroke-width="0.6" opacity="0.9"/>
  <text x="575" y="529" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" fill="#10b981" font-weight="700">IBM</text>
  <text x="575" y="546" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#4e7192" letter-spacing="1">CAPSTONE PROJECT</text>

  <!-- Bottom bar -->
  <rect x="0" y="575" width="1200" height="55" fill="#010b15" opacity="0.85"/>
  <line x1="0" y1="575" x2="1200" y2="575" stroke="#0ea5e9" stroke-width="0.5" opacity="0.25"/>
  <text x="60"  y="607" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#38bdf8" letter-spacing="1.5" opacity="0.8">MYSQL</text>
  <text x="114" y="607" font-family="ui-monospace,monospace" font-size="9" fill="#4e7192">·</text>
  <text x="128" y="607" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#38bdf8" letter-spacing="1.5" opacity="0.8">POSTGRESQL</text>
  <text x="228" y="607" font-family="ui-monospace,monospace" font-size="9" fill="#4e7192">·</text>
  <text x="242" y="607" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#38bdf8" letter-spacing="1.5" opacity="0.8">AIRFLOW</text>
  <text x="314" y="607" font-family="ui-monospace,monospace" font-size="9" fill="#4e7192">·</text>
  <text x="328" y="607" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#38bdf8" letter-spacing="1.5" opacity="0.8">APACHE SPARK</text>
  <text x="436" y="607" font-family="ui-monospace,monospace" font-size="9" fill="#4e7192">·</text>
  <text x="450" y="607" font-family="ui-monospace,'Courier New',monospace" font-size="9" fill="#38bdf8" letter-spacing="1.5" opacity="0.8">ETL</text>
