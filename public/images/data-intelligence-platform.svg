  <text x="990" y="215" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="11" fill="#fdba74" letter-spacing="1">PREDICTIVE MODELS</text>
  <line x1="905" y1="228" x2="1075" y2="228" stroke="#ea580c" stroke-width="0.8" opacity="0.6"/>
  <text x="990" y="252" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#fdba74">Demand forecasting</text>
  <text x="990" y="272" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#fdba74">ML pipeline</text>
  <text x="990" y="292" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#fdba74">Production deployed</text>
  <text x="990" y="312" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#fb923c">Q3 · Go-live</text>
