  <text x="600" y="68" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="11" fill="#38bdf8" letter-spacing="4" opacity="0.85">DATA WAREHOUSE MODERNIZATION PROGRAM</text>
  <text x="600" y="88" text-anchor="middle" font-family="ui-monospace,'Courier New',monospace" font-size="9"  fill="#4e7192" letter-spacing="2">18 MONTHS · FIXED-FEE · PROGRAM MANAGEMENT</text>
  <line x1="300" y1="100" x2="900" y2="100" stroke="#0ea5e9" stroke-width="0.5" opacity="0.2"/>

  <!-- ── PIPELINE FLOW (y center = 285) ── -->

  <!-- Pipe line (background) -->
  <rect x="168" y="280" width="864" height="10" rx="5" fill="#0c4a6e" opacity="0.6"/>

  <!-- Animated-look dots on pipe -->
  <circle cx="280" cy="285" r="3" fill="#0369a1" opacity="0.7"/>
  <circle cx="360" cy="285" r="3" fill="#0469a8" opacity="0.8"/>
  <circle cx="440" cy="285" r="4" fill="#0569b0" opacity="0.9"/>
  <circle cx="520" cy="285" r="3" fill="#0679ba" opacity="0.8"/>
  <circle cx="600" cy="285" r="5" fill="#0ea5e9"/>
  <circle cx="680" cy="285" r="3" fill="#16b1f0" opacity="0.8"/>
  <circle cx="760" cy="285" r="3" fill="#22c4f4" opacity="0.9"/>
  <circle cx="840" cy="285" r="4" fill="#2dcff7" opacity="0.8"/>
  <circle cx="920" cy="285" r="3" fill="#38bdf8" opacity="0.7"/>

